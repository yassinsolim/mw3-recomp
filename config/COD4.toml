# Two AltiVec instructions the pinned recompiler does not know (it has only
# their VMX128 forms; MW2 and MW3 never use the plain ones): vandc and vctuxs,
# nine instructions in three functions. Each is replaced by a function of the
# runtime (runtime/ppc_extra_instructions.h) and stepped over, which leaves the
# recompiler, and with it the other titles' game-library statements, as it is.
# The recompiler declares a hook with its registers as the parameters' names,
# so one whose result goes where an operand came from has a form of its own.
# The recompiler still reports each as unrecognised; nothing is emitted for it.

[[midasm_hook]]
name = "PpcVandc"
address = 0x820A3B10
registers = ["v12", "v8", "v3"]
jump_address = 0x820A3B14

[[midasm_hook]]
name = "PpcVandc"
address = 0x820A3C28
registers = ["v11", "v8", "v31"]
jump_address = 0x820A3C2C

[[midasm_hook]]
name = "PpcVandc"
address = 0x820A3C2C
registers = ["v8", "v9", "v30"]
jump_address = 0x820A3C30

[[midasm_hook]]
name = "PpcVctuxsInPlace"
address = 0x82122130
registers = ["v8"]
jump_address = 0x82122134

[[midasm_hook]]
name = "PpcVctuxsInPlace"
address = 0x8212213C
registers = ["v9"]
jump_address = 0x82122140

[[midasm_hook]]
name = "PpcVctuxsInPlace"
address = 0x8212214C
registers = ["v7"]
jump_address = 0x82122150

[[midasm_hook]]
name = "PpcVctuxsInPlace"
address = 0x82122160
registers = ["v8"]
jump_address = 0x82122164

[[midasm_hook]]
name = "PpcVandc"
address = 0x82131F38
registers = ["v0", "v8", "v1"]
jump_address = 0x82131F3C

[[midasm_hook]]
name = "PpcVandcInPlace"
address = 0x82131F3C
registers = ["v0", "v12"]
jump_address = 0x82131F40
