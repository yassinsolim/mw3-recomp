# Call of Duty: Advanced Warfare, the multiplayer (default_mp.pe, the S1 engine's Xbox 360
# build), the game disc's executable. Every address was found by
# tools/port_hooks.py --version tu0 from MW2's disc executable: each helper
# matches once, with MW2's size and bytes but for linker-filled immediates and
# branch targets (docs/AW-BRINGUP.md).
# Executable SHA-256: 3ef96359f96ee7994e43de70f56a9c2a019d5b841f11318ca2dffdb717b265f8

[main]
file_path = "../aw/tu0/default_mp.xex"
out_directory_path = "../ppc_aw_mp"
switch_table_file_path = "awmp_switch_tables.toml"

skip_lr = false
skip_msr = false
ctr_as_local = true
xer_as_local = true
reserved_as_local = true
cr_as_local = true
non_argument_as_local = true
non_volatile_as_local = true

# Functions with an exception handler have two words in front of them: the
# handler's address and the address of its scope table. They are data, and the
# recompiler, which takes whatever lies between two functions for code, made a
# function of each pair that ran on into the next one's jump tables. The
# handlers are the two addresses that stand eight bytes before the most
# functions .pdata describes (198 times 821E7EA0, 27 times 82830B7C).
invalid_instructions = [
    { data = 0x821E7EA0, size = 8 },
    { data = 0x82830B7C, size = 8 },
]

# The C runtime's register save/restore helpers.
restgprlr_14_address = 0x821E6E40
savegprlr_14_address = 0x821E6DF0
restfpr_14_address   = 0x821E742C
savefpr_14_address   = 0x821E73E0
restvmx_14_address   = 0x821E77D8
savevmx_14_address   = 0x821E7540
restvmx_64_address   = 0x821E786C
savevmx_64_address   = 0x821E75D4

# The C runtime's setjmp and longjmp (Com_Error leaves an error by longjmp).
setjmp_address  = 0x8281E240
longjmp_address = 0x821DFF00

# Leaf functions (no stack frame, hence absent from .pdata) that contain jump
# tables. The analyser ends them early because a table dispatch looks like a
# tail call. Extents derived by tools/fixbounds.py (MW2_TITLE=awmp) from bl
# targets, padding runs and the tables' own case labels. With them, what
# tools/ctr_branch_extents.py finds: the functions whose counting branches (a
# small switch written as a chain of bdz/bdzf) leave them, and a leaf function
