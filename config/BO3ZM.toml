# Call of Duty: Black Ops III, the zombies (cod_xenon_zm_Final.pe, Treyarch's engine as built
# for the Xbox 360): the executable title update 5 makes of the disc's
# default_zm.xex (XenonRecomp's patcher, tools/xexpatch.cpp, with the update's
# default_zm.xexp; version 0.0.8.5). The disc's own reads none of the game's
# downloaded fastfiles (docs/BO3-BRINGUP.md). Every address was found by
# tools/port_hooks.py --version tu0 from MW2's disc executable: each helper
# matches once, with MW2's size and bytes but for linker-filled immediates and
# branch targets.
# Executable SHA-256: 59554cd7fc42ab53aa8be4515564d1614fe418a05f32d610eaee0869c07a02ea

[main]
file_path = "../bo3/tu5/default_zm.xex"
out_directory_path = "../ppc_bo3_zm"
switch_table_file_path = "bo3zm_switch_tables.toml"

skip_lr = false
skip_msr = false
ctr_as_local = true
xer_as_local = true
reserved_as_local = true
cr_as_local = true
non_argument_as_local = true
non_volatile_as_local = true

# Functions with an exception handler have two words in front of them: the
# handler's address and the address of its scope table. They are data, and the
# recompiler, which takes whatever lies between two functions for code, would
# make a function of each pair (docs/AW-BRINGUP.md). The handlers are the two
# addresses of code that stand eight bytes before the most functions .pdata
# describes (410 times 82A0A150, 64 times 82A8428C).
invalid_instructions = [
    { data = 0x82A0A150, size = 8 },
    { data = 0x82A8428C, size = 8 },
]

# The C runtime's register save/restore helpers.
restgprlr_14_address = 0x82A08D00
savegprlr_14_address = 0x82A08CB0
restfpr_14_address   = 0x82A097BC
savefpr_14_address   = 0x82A09770
restvmx_14_address   = 0x82A09AD8
savevmx_14_address   = 0x82A09840
restvmx_64_address   = 0x82A09B6C
savevmx_64_address   = 0x82A098D4

# The C runtime's setjmp and longjmp (Com_Error leaves an error by longjmp).
setjmp_address  = 0x82A52740
longjmp_address = 0x82A03720

# Leaf functions (no stack frame, hence absent from .pdata) that contain jump
# tables. The analyser ends them early because a table dispatch looks like a
# tail call. Extents derived by tools/fixbounds.py (MW2_TITLE=bo3zm) from bl
# targets, padding runs and the tables' own case labels. With them, what
# tools/ctr_branch_extents.py finds: the functions whose counting branches (a
# small switch written as a chain of bdz/bdzf) leave them, and a leaf function
# reached only by another's closing branch.
functions = [
