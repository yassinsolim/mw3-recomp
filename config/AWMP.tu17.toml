# Call of Duty: Advanced Warfare, the multiplayer as title update 17 makes it
# (version 0.0.17.x: the update's default_mp.xexp applied to the game disc's
# default_mp.xex, docs/AW-BRINGUP.md, "Title update 17"). The downloadable
# content needs it: the Compatibility Packs and Exo Zombies are not in the
# disc's executable. Every address was found by tools/map_aw_tu17.py from the
# disc's executable (config/AWMP.toml): each helper matches once, with the
# disc's size and bytes but for linker-filled immediates and branch targets.
# The image's SHA-256 (the update's header differs with the disc's pressing,
# the image does not): 9112629a870d860e17f4f30abe3c1c60ae2919d9697e58ddf12552ab74efaf55

[main]
file_path = "../aw/tu17/default_mp.xex"
out_directory_path = "../ppc_aw_mp_tu17"
switch_table_file_path = "awmp_switch_tables.tu17.toml"

skip_lr = false
skip_msr = false
ctr_as_local = true
xer_as_local = true
reserved_as_local = true
cr_as_local = true
non_argument_as_local = true
non_volatile_as_local = true

# Functions with an exception handler have two words in front of them: the
# handler's address and the address of its scope table. They are data, and the
# recompiler, which takes whatever lies between two functions for code, made a
# function of each pair that ran on into the next one's jump tables. The
# handlers are the two addresses that stand eight bytes before the most
# functions .pdata describes (501 times 821F4F90, 62 times 827D3B54).
invalid_instructions = [
    { data = 0x821F4F90, size = 8 },
    { data = 0x827D3B54, size = 8 },
]

# The C runtime's register save/restore helpers.
restgprlr_14_address = 0x821F3F30
savegprlr_14_address = 0x821F3EE0
restfpr_14_address   = 0x821F451C
savefpr_14_address   = 0x821F44D0
restvmx_14_address   = 0x821F48C8
savevmx_14_address   = 0x821F4630
restvmx_64_address   = 0x821F495C
savevmx_64_address   = 0x821F46C4

# The C runtime's setjmp and longjmp (Com_Error leaves an error by longjmp).
setjmp_address  = 0x827C0FB0
longjmp_address = 0x821ED5F0

# Leaf functions (no stack frame, hence absent from .pdata) that contain jump
# tables. The analyser ends them early because a table dispatch looks like a
# tail call. Extents derived by tools/fixbounds.py (MW2_TITLE=awmp17) from bl
# targets, padding runs and the tables' own case labels. With them, what
# tools/ctr_branch_extents.py finds: the functions whose counting branches (a
# small switch written as a chain of bdz/bdzf) leave them, and a leaf function
# reached only by another's closing branch.
functions = [
    { address = 0x821333F0, size = 0xA8 },
    { address = 0x821AF770, size = 0x270 },
    { address = 0x82288470, size = 0x1B0 },
    { address = 0x822E6E78, size = 0x74 },
    { address = 0x82363D78, size = 0x1A0 },
    { address = 0x82363F18, size = 0x1F4 },
    { address = 0x82370330, size = 0x11C },
    { address = 0x82386DD8, size = 0x6C },
    { address = 0x8239F390, size = 0xB4 },
    { address = 0x82441618, size = 0x74 },
    { address = 0x824416E8, size = 0x1B0 },
    { address = 0x82454108, size = 0xA0 },
    { address = 0x824863C0, size = 0x428 },
    { address = 0x825731F8, size = 0xC4 },
    { address = 0x825732C0, size = 0xCC },
    { address = 0x825735C8, size = 0x2A0 },
    { address = 0x825E1018, size = 0x114 },
    { address = 0x826E2490, size = 0xA38 },
    { address = 0x82726FCC, size = 0x8 },
    { address = 0x8272717C, size = 0x10 },
    { address = 0x82727184, size = 0x8 },
    { address = 0x82727298, size = 0xB4 },
    { address = 0x82788A38, size = 0xE4 },
]

# Instructions the pinned recompiler has no case for (it knows the forms the
# earlier titles use and no others):
# bdnzt (2), lvehx (4), mulhd (1), rldicl. (6), rlwimi. (2), vaddsws (2),
# vcmpgtsb (6), vmaxuh (12), vminsw (296), vminuh (12), vpkuhus128 (1),
# vpkuwus128 (1), vsububm (6), vsubuwm (72), vupkd3d128 (6).
# Each is replaced by a function of the runtime
# (runtime/recomp/ppc_extra_instructions.cpp) and stepped over, which leaves
# the recompiler, and with it the other titles' game-library statements, as it
# is. The recompiler still reports each as unrecognised; nothing is emitted for
# it. Written by tools/extra_instructions.py from that report.
# The forms that record (the names with a dot) are not stepped over: the
# recompiler writes their operation, and the hook after it sets cr0.

