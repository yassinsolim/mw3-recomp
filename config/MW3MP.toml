    { address = 0x824D22B0, size = 0xAC },
    { address = 0x8252A668, size = 0xC04 },
    { address = 0x82559508, size = 0x4D8 },
    { address = 0x82563CE8, size = 0x4E8 },

    # The 8 bytes of exception-handler data (a pointer to 0x82548880 and one to
    # the function's own record) ahead of the last three functions above, as in
