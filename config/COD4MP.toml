# Two AltiVec instructions the pinned recompiler does not know (it has only
# their VMX128 forms; MW2 and MW3 never use the plain ones): vandc and vctuxs,
# nine instructions in three functions. Each is replaced by a function of the
# runtime (runtime/recomp/ppc_extra_instructions.cpp) and stepped over, which leaves the
# recompiler, and with it the other titles' game-library statements, as it is.
# The recompiler declares a hook with its registers as the parameters' names,
# so one whose result goes where an operand came from has a form of its own.
# The recompiler still reports each as unrecognised; nothing is emitted for it.

[[midasm_hook]]
name = "PpcVandc"
address = 0x820B33F0
registers = ["v12", "v8", "v3"]
jump_address = 0x820B33F4

[[midasm_hook]]
name = "PpcVandc"
address = 0x820B3508
registers = ["v11", "v8", "v31"]
jump_address = 0x820B350C

[[midasm_hook]]
name = "PpcVandc"
address = 0x820B350C
registers = ["v8", "v9", "v30"]
jump_address = 0x820B3510

[[midasm_hook]]
name = "PpcVctuxsInPlace"
address = 0x82153770
registers = ["v8"]
jump_address = 0x82153774

[[midasm_hook]]
name = "PpcVctuxsInPlace"
address = 0x8215377C
registers = ["v9"]
jump_address = 0x82153780

[[midasm_hook]]
name = "PpcVctuxsInPlace"
address = 0x8215378C
registers = ["v7"]
jump_address = 0x82153790

[[midasm_hook]]
name = "PpcVctuxsInPlace"
address = 0x821537A0
registers = ["v8"]
jump_address = 0x821537A4

[[midasm_hook]]
name = "PpcVandc"
address = 0x821635C0
registers = ["v0", "v8", "v1"]
jump_address = 0x821635C4

[[midasm_hook]]
name = "PpcVandcInPlace"
address = 0x821635C4
registers = ["v0", "v12"]
jump_address = 0x821635C8
