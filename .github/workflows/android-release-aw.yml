# Builds Call of Duty: Advanced Warfare's Android app for a version tag and
# drafts a release with it (docs/android-releases.md). The same job as
# android-release.yml, which is Modern Warfare 3's, for the repository that
# carries Advanced Warfare from this codebase.
#
# The app is the runtime alone: it is compiled without the recompiled game
# code (-DMW2_SPLIT=runtime, cmake/game_abi.cmake), which each player builds
# from their own disc into a package of their own (docs/game-library.md). So
# this job needs no game file, receives none, and before anything is uploaded
# tools/check_runtime_apk.py reads the APK's libraries symbol by symbol and
# fails the job if any recompiled code is in them.
#
# It runs only in the public repository and only for a tag, and what it makes
# is a draft: nothing is published until the owner reads the notes and
# presses Publish. The installed apps look for a published release, find the
# APK by its name (aw-recomp-<tag>.apk) and compare the version the tag
# stands for (v1.2.3 is versionCode 10203) with their own.
#
# Secrets (repository settings, Secrets and variables, Actions), under the
# names Modern Warfare 3's repository has them, for the one release keystore:
#   MW3_KEYSTORE_BASE64     the release keystore, base64 of the .jks file
#   MW3_KEYSTORE_PASSWORD   its password
#   MW3_KEY_ALIAS           the key's alias in it
#   MW3_KEY_PASSWORD        the key's password
name: Android release (Advanced Warfare)

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'yassinsolim/aw-recomp'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # The disc the published app installs and runs (the 2014 game disc's own
      # build, the only one this port supports): CMakeLists.txt has its two
      # executables' hashes for a build with no aw/tu0 folder, so with no
      # disc here to hash nothing has to be told.
      # As setup/setup.ps1 builds, and as the app was tested.
      MW2_LTO: "OFF"
      # The certificate every release is signed with. An update signed with
      # any other is refused by Android, so a wrong keystore in the secrets
      # must fail here and not on players' phones.
      RELEASE_CERTIFICATE_SHA256: 3aad5c3b3e4817007c659eb0b03e4480184aff631d13e0badbaa15f47ab36e06
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Ensure no game files are tracked
        run: python3 tools/check_no_game_files.py

      - name: The version this tag stands for
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          IFS=. read -r major minor patch <<< "${version}"
          # Two digits each for minor and patch (MainActivity.kt, versionCodeOfTag).
          if [ "${minor}" -gt 99 ] || [ "${patch}" -gt 99 ]; then
            echo "minor and patch must be below 100: ${tag}" >&2
            exit 1
          fi
          {
            echo "MW2_VERSION_NAME=${version}"
            echo "MW2_VERSION_CODE=$((major * 10000 + minor * 100 + patch))"
            echo "MW2_BUILD_SHA=${GITHUB_SHA::7}"
            echo "MW2_BUILD_STAMP=$(date -u +%Y-%m-%d)"
            echo "APK_NAME=aw-recomp-${tag}.apk"
          } >> "${GITHUB_ENV}"

      - name: Install the NDK and CMake the app is built with
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - name: Fetch the dependencies that are not vendored
        run: |
          # Mesa's build tools, for the Android 10 Turnip (android/build_turnip.sh).
          sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build bison flex glslang-tools > /dev/null
          python3 -m pip install --quiet meson==1.12.1 mako pyyaml packaging
          REQUIRE_TURNIP_API29=1 bash android/fetch_deps.sh

      - name: The release keystore
        env:
          MW3_KEYSTORE_BASE64: ${{ secrets.MW3_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${MW3_KEYSTORE_BASE64}" ]; then
            echo "The MW3_KEYSTORE_BASE64 secret is not set (docs/android-releases.md)." >&2
            exit 1
          fi
          printf '%s' "${MW3_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/release.jks"
          echo "MW2_KEYSTORE=${RUNNER_TEMP}/release.jks" >> "${GITHUB_ENV}"

      - name: Build the app, without the game
        env:
          MW2_KEYSTORE_PASSWORD: ${{ secrets.MW3_KEYSTORE_PASSWORD }}
          MW2_KEY_ALIAS: ${{ secrets.MW3_KEY_ALIAS }}
          MW2_KEY_PASSWORD: ${{ secrets.MW3_KEY_PASSWORD }}
        working-directory: android
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          ./gradlew --no-daemon :app:assembleAwTu0Release
          cp app/build/outputs/apk/awTu0/release/*.apk "${RUNNER_TEMP}/${APK_NAME}"
          # What a game library has to be built against for this app to take
          # it, a line for each statement of each title, the earlier ones it
          # still takes among them (cmake/game_abi.cmake): published beside
          # the app, for setup/setup.ps1 to compare a player's build with.
          # Three titles here: the campaign, the multiplayer, and the multiplayer
          # of title update 17 that a player's map packs need (docs/dlc.md).
          find app/.cxx -name game_abi.txt -exec cat {} + | sort -u > "${RUNNER_TEMP}/${APK_NAME%.apk}-game-abi.txt"
          cat "${RUNNER_TEMP}/${APK_NAME%.apk}-game-abi.txt"
          [ "$(cut -d' ' -f1 "${RUNNER_TEMP}/${APK_NAME%.apk}-game-abi.txt" | sort -u | wc -l)" = 3 ]

      - name: Refuse an APK with recompiled code or game files in it
        run: python3 tools/check_runtime_apk.py "${RUNNER_TEMP}/${APK_NAME}"

      - name: Refuse an APK signed with anything but the release key
        run: |
          apksigner="$(ls "${ANDROID_HOME}"/build-tools/35.0.0/apksigner)"
          signed="$("${apksigner}" verify --print-certs "${RUNNER_TEMP}/${APK_NAME}" |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          echo "signed with ${signed}"
          [ "${signed}" = "${RELEASE_CERTIFICATE_SHA256}" ]

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "${RUNNER_TEMP}/${APK_NAME}" "${RUNNER_TEMP}/${APK_NAME%.apk}-game-abi.txt" \
            --repo "${GITHUB_REPOSITORY}" --draft --verify-tag --generate-notes \
            --title "Call of Duty: Advanced Warfare for Android ${GITHUB_REF_NAME}"
